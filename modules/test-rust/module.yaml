name: test-rust
description: nextest test matrix with optional Codecov coverage
version: 1.2.0
language: rust
requires: [base-layout]
questions:
  - id: enable_codecov
    prompt: "Upload coverage to Codecov?"
    type: bool
    default: false
files: # dest is always "." — src carries the subdir
  - src: ".github/workflows/test.yml"
    dest: "."
  - src: ".github/workflows/coverage.yml"
    dest: "."
    when: "{{ .enable_codecov }}"
# The check is the aggregate gate job, not the matrix: the matrix reports one
# context per OS, so its names change whenever the matrix does.
emits:
  checks: [test]
  actions: [dtolnay/rust-toolchain, taiki-e/install-action, codecov/codecov-action]
