name: go-mod
description: Go module with a cmd/<name> entrypoint (service, cli) or a root package (library)
version: 2.2.0
language: go
requires: [base-layout]
files: # dest is always "." — src carries the subdir
  - src: "go.mod.tmpl"
    dest: "."
    # The user's first `go get` makes the content partly theirs. Until they edit
    # it, update keeps it current (--reconfigure still rewrites the module path);
    # after that it is skipped silently, and dep changes are reported instead.
    user_owned: true
  - src: "cmd/{{.repo_name}}/main.go.tmpl"
    dest: "."
    when: '{{ not .is_library }}'
  - src: "doc.go.tmpl"
    dest: "."
    when: '{{ .is_library }}'
  - src: "{{.repo_name}}.go.tmpl"
    dest: "."
    when: '{{ .is_library }}'
  - src: "{{.repo_name}}_test.go.tmpl"
    dest: "."
    when: '{{ .is_library }}'
