name: spell
description: Spell-check with crate-ci/typos
version: 1.2.0
language: any
requires: [base-layout]
files: # dest is always "." — src carries the subdir (see Task 5 note)
  - src: ".typos.toml"
    dest: "."
  - src: ".github/workflows/typos.yml"
    dest: "."
emits:
  checks: [typos]
  actions: [crate-ci/typos]
