name: release-rust
description: release-plz (version/changelog) + cargo-dist (binaries) with a conventional-commit gate
version: 1.1.0
language: rust
requires: [base-layout]
files: # dest is always "." — src carries the subdir
  - src: ".github/workflows/release-plz.yml"
    dest: "."
  - src: "release-plz.toml"
    dest: "."
  - src: ".github/workflows/pr-title.yml"
    dest: "."
