name: release-rust
description: release-plz (version/changelog) + cargo-dist (binaries) with a conventional-commit gate
version: 1.1.0
language: rust
requires: [base-layout]
files: # dest is always "." — src carries the subdir
  - src: ".github/workflows/release-plz.yml"
    dest: "."
  - src: "release-plz.toml"
    dest: "."
  - src: ".github/workflows/pr-title.yml"
    dest: "."
# pr-title.yml runs on pull_request and is a required check. release-plz.yml
# runs on push to main and opens a release PR, hence the capability below.
emits:
  checks: [pr-title]
  actions:
    - amannn/action-semantic-pull-request
    - dtolnay/rust-toolchain
    - MarcoIeni/release-plz-action
  needs: [can_approve_pull_request_reviews]
