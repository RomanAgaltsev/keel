name: test-go
description: race/shuffle test workflow with coverage and optional Codecov upload
version: 2.2.0
language: go
requires: [base-layout]
questions:
  - id: enable_codecov
    prompt: "Upload coverage to Codecov?"
    type: bool
    default: false
files: # dest is always "." — src carries the subdir
  - src: ".github/workflows/test.yml.tmpl"
    dest: "."
  - src: "codecov.yml.tmpl"
    dest: "."
    when: "{{ .enable_codecov }}"
# The check is the aggregate gate job, not the matrix: the matrix reports one
# context per OS, so its names change whenever the matrix does.
emits:
  checks: [test]
  actions: [codecov/codecov-action]
