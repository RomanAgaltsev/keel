name: release-go
description: release-please releases, with GoReleaser binaries for binary archetypes
version: 2.3.0
language: go
requires: [base-layout]
files: # dest is always "." — src carries the subdir
  - src: ".goreleaser.yaml.tmpl"
    dest: "."
    when: '{{ not .is_library }}'
  - src: "release-please-config.json.tmpl"
    dest: "."
  - src: ".release-please-manifest.json"
    dest: "."
  - src: ".github/workflows/release.yml.tmpl"
    dest: "."
  - src: ".github/workflows/pr-title.yml"
    dest: "."
# pr-title.yml runs on pull_request and is a required check. release.yml runs on
# push to main, so release-please and goreleaser never report on a PR and must
# not be required -- but release-please cannot open its release PR without the
# capability below.
emits:
  checks: [pr-title]
  actions:
    - amannn/action-semantic-pull-request
    - googleapis/release-please-action
    - goreleaser/goreleaser-action
  needs: [can_approve_pull_request_reviews]
