name: security-rust
description: cargo-audit + cargo-deny, dependency-review, workflow linting
version: 1.2.0
language: rust
requires: [base-layout]
questions:
  - id: enable_cargo_audit
    prompt: "Enable cargo-audit (RUSTSEC advisories)?"
    type: bool
    default: true
  - id: enable_cargo_deny
    prompt: "Enable cargo-deny (licenses/bans/sources)?"
    type: bool
    default: true
files: # dest is always "." — src carries the subdir
  - src: ".github/workflows/cargo-audit.yml"
    dest: "."
    when: "{{ .enable_cargo_audit }}"
  - src: ".github/workflows/cargo-deny.yml"
    dest: "."
    when: "{{ .enable_cargo_deny }}"
  - src: "deny.toml"
    dest: "."
    when: "{{ .enable_cargo_deny }}"
  - src: ".github/workflows/dependency-review.yml"
    dest: "."
  - src: ".github/workflows/actionlint.yml"
    dest: "."
# Rust keeps one workflow per concern, so its dependency-review job is named
# `review` -- not `dependency-review` as in Go's consolidated security.yml.
# audit and deny are answer-gated; emits is the maximum this module contributes.
emits:
  checks: [review, actionlint, audit, deny]
  actions: [docker://rhysd/actionlint, rustsec/audit-check, EmbarkStudios/cargo-deny-action]
