name: meta-scaffold
on:
  pull_request:
  schedule: [{ cron: "0 5 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaffold-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: arduino/setup-task@v3
        with: { version: 3.x, repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: task build
      - run: ./bin/keel new --no-input --answers testdata/meta/answers.yaml --target /tmp/metademo
      - name: Run the scaffolded repo's own gate
        working-directory: /tmp/metademo
        run: |
          go mod tidy
          task setup
          task ci
          task build
          ./bin/metademo

  cross-release-update:
    name: update a repo scaffolded by the previous release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: arduino/setup-task@v3
        with: { version: 3.x, repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Scaffold with the previous release
        run: |
          PREV=$(git tag --sort=-v:refname | grep '^v' | head -1)
          echo "previous release: $PREV"
          # Build from the tag rather than `go install ...@$PREV`. Tags v2.0.0
          # through v2.1.0 were published while go.mod still declared the module
          # as .../keel with no /v2 suffix, so the proxy rejects them forever
          # ("module path must match major version"). The path is fixed going
          # forward, but those tags cannot be re-published — and a worktree
          # build works for every tag, old or new, without touching the proxy.
          git worktree add /tmp/prev "$PREV"
          (cd /tmp/prev && go build -o /tmp/prevkeel ./cmd/keel)
          /tmp/prevkeel new --no-input --answers testdata/meta/answers.yaml --target /tmp/xrel
      - name: Update it with HEAD
        run: |
          task build
          ./bin/keel update --path /tmp/xrel
      - name: The update must have delivered the current recipe
        working-directory: /tmp/xrel
        run: |
          set -e
          for f in LICENSE CONTRIBUTING.md SECURITY.md Taskfile.yml; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          go mod tidy
          task setup
          task ci

  scaffold-library:
    name: scaffold a go-library repo and run its gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: arduino/setup-task@v3
        with: { version: 3.x, repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: task build
      - run: ./bin/keel new --no-input --recipe go-library --answers testdata/meta/answers-library.yaml --target /tmp/metalib
      - name: Run the scaffolded library's own gate
        working-directory: /tmp/metalib
        run: |
          go mod tidy
          task setup
          task ci
      - name: The library scaffold must carry no binary machinery
        working-directory: /tmp/metalib
        run: |
          set -e
          test ! -e cmd
          test ! -e .goreleaser.yaml
          # `! grep ...` under set -e is a no-op assertion (shellcheck SC2251):
          # the negation suppresses errexit, so it passes either way. Use an if.
          if grep -q '^  build:' Taskfile.yml; then
            echo "Taskfile still has a build task"; exit 1
          fi
          if grep -q goreleaser .github/workflows/release.yml; then
            echo "release.yml still has a goreleaser job"; exit 1
          fi

  scaffold-cli:
    name: scaffold a go-cli repo and run its gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: arduino/setup-task@v3
        with: { version: 3.x, repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: task build
      - run: ./bin/keel new --no-input --recipe go-cli --answers testdata/meta/answers-cli.yaml --target /tmp/metacli
      - name: Run the scaffolded CLI's own gate
        working-directory: /tmp/metacli
        run: |
          go mod tidy
          task setup
          task ci
      - name: The built binary must report its version
        working-directory: /tmp/metacli
        run: |
          set -e
          task build
          ./bin/metacli version

  scaffold-analyzer:
    name: scaffold a go-analyzer repo and run its gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: arduino/setup-task@v3
        with: { version: 3.x, repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: task build
      - run: ./bin/keel new --no-input --recipe go-analyzer --answers testdata/meta/answers-analyzer.yaml --target /tmp/metaanalyzer
      # `task ci` runs `go mod tidy` first, so a green gate proves x/tools
      # survives tidy, go.sum materialises, and analysistest runs against the
      # emitted corpus.
      - name: Run the scaffolded analyzer's own gate
        working-directory: /tmp/metaanalyzer
        run: |
          go mod tidy
          task setup
          task ci
      - name: x/tools must survive tidy
        working-directory: /tmp/metaanalyzer
        run: |
          set -e
          if ! grep -q 'golang.org/x/tools' go.mod; then
            echo "go mod tidy stripped x/tools: the emitted analyzer does not import it"
            exit 1
          fi
      # The shipped fixture has no imports, so gci has nothing to reorder and a
      # diff against it could never fail -- a vacuous check, which is the
      # pattern ROADMAP §J exists to stop. Drop in a deliberately non-canonical
      # probe instead: gci reorders it if and only if the testdata exclusion is
      # missing. Verified in both directions before this shipped.
      - name: task format must leave testdata untouched
        working-directory: /tmp/metaanalyzer
        run: |
          set -e
          probe=analyzer/metaanalyzer/testdata/src/a/probe.go
          printf 'package a\n\nimport (\n\t"example.com/z"\n\t"fmt"\n)\n\nvar _ = fmt.Sprint(z.X)\n' > "$probe"
          cp "$probe" /tmp/probe.before
          task format
          if ! diff -q /tmp/probe.before "$probe" >/dev/null; then
            echo "task format rewrote a file under testdata"
            diff /tmp/probe.before "$probe" || true
            exit 1
          fi
          rm -f "$probe"
